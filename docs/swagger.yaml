basePath: /api/v1
definitions:
  activity.ActivityListResponse:
    properties:
      activities:
        items:
          $ref: '#/definitions/activity.ActivityResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  activity.ActivityResponse:
    properties:
      action:
        type: string
      actor:
        $ref: '#/definitions/activity.ActorSummary'
      created_at:
        type: string
      details:
        type: object
      id:
        type: string
      organization_id:
        type: string
      project_id:
        type: string
      task_id:
        type: string
    type: object
  activity.ActorSummary:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
    type: object
  auth.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: Expiry in seconds
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RefreshTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: Expiry in seconds
        type: integer
      refresh_token:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  auth.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      reset_token:
        type: string
    required:
    - new_password
    - reset_token
    type: object
  auth.UserResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
    type: object
  auth.VerifyOTPRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
  auth.VerifyOTPResponse:
    properties:
      message:
        type: string
      reset_token:
        type: string
    type: object
  comments.AuthorSummary:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
    type: object
  comments.CommentResponse:
    properties:
      author:
        $ref: '#/definitions/comments.AuthorSummary'
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      task_id:
        type: string
      updated_at:
        type: string
    type: object
  comments.CreateCommentRequest:
    properties:
      content:
        maxLength: 5000
        minLength: 1
        type: string
    required:
    - content
    type: object
  comments.UpdateCommentRequest:
    properties:
      content:
        maxLength: 5000
        minLength: 1
        type: string
    required:
    - content
    type: object
  notifications.ActorSummary:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
    type: object
  notifications.NotificationListResponse:
    properties:
      limit:
        type: integer
      notifications:
        items:
          $ref: '#/definitions/notifications.NotificationResponse'
        type: array
      offset:
        type: integer
      total:
        type: integer
      unread:
        type: integer
    type: object
  notifications.NotificationResponse:
    properties:
      actor:
        $ref: '#/definitions/notifications.ActorSummary'
      created_at:
        type: string
      entity_id:
        type: string
      entity_type:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      message:
        type: string
      read_at:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  notifications.UnreadCountResponse:
    properties:
      unread_count:
        type: integer
    type: object
  organization.AcceptInvitationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  organization.CreateOrganizationRequest:
    properties:
      description:
        type: string
      logo_url:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  organization.InvitationResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      organization_id:
        type: string
      role:
        type: string
      status:
        type: string
      token:
        type: string
    type: object
  organization.InviteMemberRequest:
    properties:
      email:
        type: string
      role:
        enum:
        - admin
        - developer
        - viewer
        type: string
    required:
    - email
    - role
    type: object
  organization.MemberResponse:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      joined_at:
        type: string
      last_name:
        type: string
      organization_id:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  organization.OrganizationResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      logo_url:
        type: string
      name:
        type: string
      slug:
        type: string
      updated_at:
        type: string
      user_role:
        type: string
    type: object
  organization.UpdateMemberRoleRequest:
    properties:
      role:
        enum:
        - admin
        - developer
        - viewer
        type: string
    required:
    - role
    type: object
  organization.UpdateOrganizationRequest:
    properties:
      description:
        type: string
      logo_url:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  projects.AssignMemberRequest:
    properties:
      role:
        enum:
        - lead
        - developer
        - viewer
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  projects.CreateProjectRequest:
    properties:
      description:
        type: string
      key:
        maxLength: 10
        minLength: 2
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - key
    - name
    type: object
  projects.ProjectMemberResponse:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      joined_at:
        type: string
      last_name:
        type: string
      project_id:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  projects.ProjectResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      key:
        type: string
      name:
        type: string
      organization_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_role:
        type: string
    type: object
  projects.UpdateMemberRoleRequest:
    properties:
      role:
        enum:
        - lead
        - developer
        - viewer
        type: string
    required:
    - role
    type: object
  projects.UpdateProjectRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      status:
        enum:
        - active
        - archived
        - completed
        type: string
    type: object
  response.ErrorDetail:
    properties:
      code:
        example: BAD_REQUEST
        type: string
      details:
        items:
          $ref: '#/definitions/response.FieldError'
        type: array
      message:
        example: Invalid request body
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.ErrorDetail'
      status:
        example: error
        type: string
    type: object
  response.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  response.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  response.PaginatedResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/response.Meta'
      status:
        example: success
        type: string
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      status:
        example: success
        type: string
    type: object
  tasks.CreateTaskRequest:
    properties:
      assignee_id:
        type: string
      description:
        type: string
      due_date:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        - urgent
        type: string
      status:
        enum:
        - backlog
        - todo
        - in_progress
        - in_review
        - done
        - cancelled
        type: string
      title:
        maxLength: 255
        minLength: 2
        type: string
      type:
        enum:
        - task
        - bug
        - feature
        - improvement
        type: string
    required:
    - title
    type: object
  tasks.TaskResponse:
    properties:
      assignee:
        $ref: '#/definitions/tasks.UserSummary'
      created_at:
        type: string
      description:
        type: string
      due_date:
        type: string
      id:
        type: string
      key:
        type: string
      organization_id:
        type: string
      priority:
        type: string
      project_id:
        type: string
      reporter:
        $ref: '#/definitions/tasks.UserSummary'
      status:
        type: string
      task_number:
        type: integer
      title:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  tasks.UpdateTaskRequest:
    properties:
      assignee_id:
        type: string
      description:
        type: string
      due_date:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        - urgent
        type: string
      status:
        enum:
        - backlog
        - todo
        - in_progress
        - in_review
        - done
        - cancelled
        type: string
      title:
        maxLength: 255
        minLength: 2
        type: string
      type:
        enum:
        - task
        - bug
        - feature
        - improvement
        type: string
    type: object
  tasks.UserSummary:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@devflow.io
    name: DevFlow Engineering
  description: Production-grade project management SaaS REST API in Go with multi-tenancy,
    RBAC, background workers, and real-time WebSocket notifications.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: DevFlow API
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiates password reset by issuing a 6-digit OTP to the user's
        email
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Forgot password
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates email and password credentials and returns JWT access
        and refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes refresh token to terminate session
      parameters:
      - description: Refresh token to revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      description: Fetches detailed profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user profile
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates and issues fresh access and refresh tokens
      parameters:
      - description: Valid refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.RefreshTokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh tokens
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account and returns JWT access and refresh tokens
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a new password using a verified reset token
      parameters:
      - description: Verified reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Reset password
      tags:
      - Auth
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verifies 6-digit OTP and issues a short-lived reset token
      parameters:
      - description: Email and 6-digit OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.VerifyOTPResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Verify OTP
      tags:
      - Auth
  /comments/{id}:
    delete:
      description: Deletes a comment (author only)
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete comment
      tags:
      - Comments
    patch:
      consumes:
      - application/json
      description: Updates comment content (author only)
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated comment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/comments.UpdateCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/comments.CommentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update comment
      tags:
      - Comments
  /invitations/accept:
    post:
      consumes:
      - application/json
      description: Accepts an invitation token and adds the user to the organization
      parameters:
      - description: Acceptance token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/organization.AcceptInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/organization.OrganizationResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Accept organization invitation
      tags:
      - Organizations
  /notifications:
    get:
      description: Retrieves paginated notifications for the authenticated user
      parameters:
      - default: 20
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/notifications.NotificationListResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List notifications
      tags:
      - Notifications
  /notifications/{id}/read:
    patch:
      description: Marks an individual notification as read
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark notification as read
      tags:
      - Notifications
  /notifications/read-all:
    post:
      description: Marks all pending unread notifications as read for the user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark all notifications as read
      tags:
      - Notifications
  /notifications/unread-count:
    get:
      description: Fast count of unread notifications using partial PostgreSQL index
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/notifications.UnreadCountResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get unread notification count
      tags:
      - Notifications
  /organizations:
    get:
      description: Lists all organizations where the authenticated user is a member
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/organization.OrganizationResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List user organizations
      tags:
      - Organizations
    post:
      consumes:
      - application/json
      description: Creates a new organization workspace; the creator becomes the Owner
      parameters:
      - description: Organization details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/organization.CreateOrganizationRequest'
      produces:
